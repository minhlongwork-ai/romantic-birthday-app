<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <meta name="theme-color" content="#f2eee7" />
    <meta property="og:title" content="%SITE_OG_TITLE%" />
    <meta
      property="og:description"
      content="%SITE_OG_DESCRIPTION%"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%SITE_CANONICAL_URL%" />
    <meta property="og:image" content="%SITE_OG_IMAGE_URL%" />
    <link rel="canonical" href="%SITE_CANONICAL_URL%" />
    <link rel="icon" href="/birthday/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-vi.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/cormorant-garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>%SITE_TITLE%</title>
    <link rel="stylesheet" href="./portal.css" />
    <script type="module" src="./portal.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#gift-options">Đi tới danh sách thiệp</a>

    <main class="portal-shell">
      <header class="portal-header">
        <h1>Hôm nay em muốn mở điều gì?</h1>
        <p class="portal-intro">
          Mỗi tấm thiệp là một câu chuyện khác, được viết riêng cho em.
        </p>
      </header>

      <nav id="gift-options" class="experience-timeline" aria-label="Những tấm thiệp theo thời gian">
        <!-- EXPERIENCE_CATALOG -->
      </nav>

      <footer class="portal-footer">
        <p>Thông tin cá nhân hóa trong đường dẫn sẽ được chuyển tiếp sang thiệp em chọn.</p>
      </footer>
    </main>
  </body>
</html>
