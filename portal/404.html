<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Không tìm thấy tấm thiệp</title>
    <style>
      :root { color-scheme: light; font-family: system-ui, sans-serif; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #f3ebdd; color: #25221e; }
      main { width: min(34rem, calc(100% - 2rem)); text-align: center; }
      h1 { font-family: Georgia, serif; font-size: clamp(2.4rem, 10vw, 5rem); margin: 0 0 1rem; }
      a { display: inline-grid; min-height: 44px; place-items: center; padding: 0 1.2rem; border-radius: 999px; background: #8f3146; color: white; text-decoration: none; }
    </style>
  </head>
  <body>
    <main>
      <p>Đường dẫn này chưa dẫn tới một món quà.</p>
      <h1>Trang này không có trong cuốn thiệp.</h1>
      <a href="/">Quay về chọn thiệp</a>
    </main>
  </body>
</html>
