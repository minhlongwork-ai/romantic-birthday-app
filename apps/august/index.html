<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3ebdd" />
    <meta
      name="description"
      content="%SITE_DESCRIPTION%"
    />
    <meta property="og:title" content="%SITE_OG_TITLE%" />
    <meta
      property="og:description"
      content="%SITE_OG_DESCRIPTION%"
    />
    <meta property="og:url" content="%SITE_CANONICAL_URL%" />
    <meta property="og:image" content="%SITE_OG_IMAGE_URL%" />
    <link rel="canonical" href="%SITE_CANONICAL_URL%" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" href="data:," />
    <title>%SITE_TITLE%</title>
    <link
      rel="preload"
      href="./public/fonts/cormorant-garamond-vi.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="./public/fonts/cormorant-garamond-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./src/base.css" />
    <link rel="stylesheet" href="./src/herbarium/herbarium.css" />
  </head>
  <body>
    <a class="skip-link" href="#app-root">Đi đến nội dung thiệp</a>
    <main id="app-root" tabindex="-1"></main>
    <div id="soundtrack-root" class="soundtrack-root" hidden></div>
    <p id="app-status" class="sr-only" aria-live="polite"></p>
    <noscript>
      <p>Thiệp cần JavaScript để mở thư, chọn ảnh và tạo bưu thiếp.</p>
    </noscript>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
